# Builds the Docker image and publishes it to GitHub Container Registry, so the
# Hostinger Docker Manager (which only pulls images, it can't build) can run it.
name: Build Docker image

on:
  push:
    branches: [docker-deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/programmer786/django_boltapp:latest
            ghcr.io/programmer786/django_boltapp:${{ github.sha }}

      # WhatsApp Web listener for the verification bot.
      - uses: docker/build-push-action@v6
        with:
          context: whatsapp-listener
          push: true
          tags: |
            ghcr.io/programmer786/bolt_wa_listener:latest
            ghcr.io/programmer786/bolt_wa_listener:${{ github.sha }}
