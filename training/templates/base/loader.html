{% comment %}
Global page loader. Self-contained (styles + markup + behaviour) so it can be
included from base.html and from the standalone pages that don't extend it
(login, register, public verification).

Opt out per element with data-no-loader.
{% endcomment %}
<style>
    #globalLoader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: rgba(248, 250, 252, .88);
        backdrop-filter: blur(3px);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #globalLoader.show { display: flex; }
    #globalLoader .loader-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: .5px;
        color: #0f172a;
        text-transform: uppercase;
    }
    #globalLoader .loader-track {
        width: min(340px, 78vw);
        height: 34px;
        border: 4px solid #0f172a;
        border-radius: 99px;
        background: #fff;
        padding: 4px;
        overflow: hidden;
    }
    #globalLoader .loader-fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: #00d68f;
        transition: width .25s ease;
    }
    @media (prefers-reduced-motion: reduce) {
        #globalLoader .loader-fill { transition: none; }
    }
</style>

<div id="globalLoader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-text">Loading...</div>
    <div class="loader-track"><div class="loader-fill" id="globalLoaderFill"></div></div>
</div>

<script>
(function () {
    const loader = document.getElementById('globalLoader');
    const fill   = document.getElementById('globalLoaderFill');
    if (!loader || !fill) return;

    let timer = null, safety = null, progress = 0;

    // Indeterminate ramp: page loads have no real progress events, so climb
    // quickly to ~70% then creep toward 90% until the new page takes over.
    function start(autoHideMs) {
        if (loader.classList.contains('show')) return;
        progress = 0;
        fill.style.width = '0%';
        loader.classList.add('show');
        timer = setInterval(function () {
            const step = progress < 70 ? 6 : (progress < 88 ? 1.2 : 0.2);
            progress = Math.min(93, progress + step);
            fill.style.width = progress + '%';
        }, 120);
        clearTimeout(safety);
        safety = setTimeout(stop, autoHideMs || 30000);
    }

    function stop() {
        clearInterval(timer);
        clearTimeout(safety);
        fill.style.width = '100%';
        setTimeout(function () {
            loader.classList.remove('show');
            fill.style.width = '0%';
        }, 220);
    }

    function isModifiedClick(e) {
        return e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
    }

    // Navigation via links
    document.addEventListener('click', function (e) {
        const a = e.target.closest('a');
        if (!a || isModifiedClick(e) || e.defaultPrevented) return;
        if (a.hasAttribute('data-no-loader')) return;
        if (a.target && a.target !== '_self') return;          // new tab/window
        if (a.hasAttribute('data-bs-toggle')) return;          // modal/dropdown/collapse/tab
        if (a.hasAttribute('data-toggle')) return;             // legacy theme togglers
        if (a.hasAttribute('download')) return;

        const href = a.getAttribute('href');
        if (!href || href === '#' || href.charAt(0) === '#') return;
        if (/^(javascript:|mailto:|tel:)/i.test(href)) return;

        // Different origin — let the browser handle it without our overlay
        const url = new URL(a.href, window.location.href);
        if (url.origin !== window.location.origin) return;

        // File downloads (Excel/PDF exports) never navigate away, so the
        // loader must time itself out rather than wait for a page swap.
        const isDownload = /\/export|\.xlsx|\.csv|\/pdf|\/generate/i.test(url.pathname);
        start(isDownload ? 12000 : 30000);
    });

    // Form submissions
    document.addEventListener('submit', function (e) {
        const form = e.target;
        if (!form || e.defaultPrevented) return;
        if (form.hasAttribute('data-no-loader')) return;
        if (form.id === 'sendForm') return;   // WhatsApp page shows its own progress overlay
        if (form.getAttribute('target') === '_blank') return;

        const action = form.getAttribute('action') || '';
        const isDownload = /\/export/i.test(action);
        start(isDownload ? 12000 : 30000);
    });

    // Hide when the page is shown again (covers back/forward bfcache restores)
    window.addEventListener('pageshow', stop);
    // A download keeps us on the page; regaining focus is a good "it finished" signal
    window.addEventListener('focus', function () {
        if (loader.classList.contains('show')) setTimeout(stop, 400);
    });
})();
</script>
