
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Bolt Company - Login</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Secure login portal for Bolt Company management">

	<link rel="stylesheet" href="{% static 'css/vendor.min.css' %}" type="text/css" />
	<link rel="stylesheet" href="{% static 'css/app.min.css' %}" type="text/css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

		/* ── Custom cursor ───────────────────────────────────────── */
		*, *::before, *::after { box-sizing: border-box; }

		.cursor-dot,
		.cursor-ring {
			position: fixed;
			top: 0; left: 0;
			border-radius: 50%;
			pointer-events: none;
			z-index: 99999;
			transform: translate(-50%, -50%);
			transition: opacity .3s;
		}
		.cursor-dot {
			width: 8px; height: 8px;
			background: #38bdf8;
		}
		.cursor-ring {
			width: 36px; height: 36px;
			border: 2px solid rgba(56,189,248,.6);
			transition: transform .12s ease, opacity .3s;
		}
		.cursor-ring.shrink { transform: translate(-50%,-50%) scale(.6); }

		/* ── Page ────────────────────────────────────────────────── */
		html, body {
			margin: 0; padding: 0;
			height: 100%;
			font-family: 'Inter', sans-serif;
			cursor: none;              /* hide native cursor on login page */
			overflow: hidden;
		}

		/* Animated gradient canvas behind the card */
		#bg-canvas {
			position: fixed;
			inset: 0;
			width: 100%; height: 100%;
			z-index: 0;
		}

		/* Background photo layer */
		.bg-photo {
			position: fixed;
			inset: 0;
			background: url('{% static "img/bolt_background.jpg" %}') center/cover no-repeat;
			z-index: 1;
		}
		.bg-photo::after {
			content: '';
			position: absolute;
			inset: 0;
			background: linear-gradient(135deg, rgba(10,20,40,.82) 0%, rgba(5,30,60,.75) 100%);
		}

		/* Floating particles */
		.particles {
			position: fixed;
			inset: 0;
			z-index: 2;
			overflow: hidden;
		}
		.particle {
			position: absolute;
			border-radius: 50%;
			opacity: 0;
			animation: floatUp linear infinite;
		}

		@keyframes floatUp {
			0%   { opacity: 0; transform: translateY(0) scale(0); }
			15%  { opacity: .5; }
			85%  { opacity: .3; }
			100% { opacity: 0; transform: translateY(-100vh) scale(1.2); }
		}

		/* ── Centering wrapper ───────────────────────────────────── */
		.page-wrapper {
			position: relative;
			z-index: 10;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		/* ── Login card ──────────────────────────────────────────── */
		.login-card {
			width: 100%;
			max-width: 420px;
			background: rgba(255,255,255,.07);
			backdrop-filter: blur(24px);
			-webkit-backdrop-filter: blur(24px);
			border: 1px solid rgba(255,255,255,.15);
			border-radius: 24px;
			padding: 48px 40px 40px;
			box-shadow:
				0 8px 32px rgba(0,0,0,.45),
				0 0 0 1px rgba(255,255,255,.05) inset,
				0 1px 0 rgba(255,255,255,.12) inset;
			animation: cardEntrance .7s cubic-bezier(.22,1,.36,1) both;
		}

		@keyframes cardEntrance {
			from { opacity: 0; transform: translateY(32px) scale(.97); }
			to   { opacity: 1; transform: translateY(0)    scale(1); }
		}

		/* Logo / brand area */
		.brand-area {
			text-align: center;
			margin-bottom: 32px;
		}
		.brand-icon {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 64px; height: 64px;
			border-radius: 18px;
			background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
			box-shadow: 0 8px 24px rgba(14,165,233,.4);
			margin-bottom: 16px;
			animation: iconPulse 3s ease-in-out infinite;
		}
		@keyframes iconPulse {
			0%, 100% { box-shadow: 0 8px 24px rgba(14,165,233,.4); }
			50%       { box-shadow: 0 8px 36px rgba(14,165,233,.7); }
		}
		.brand-icon i { font-size: 28px; color: #fff; }

		.brand-title {
			color: #fff;
			font-size: 22px;
			font-weight: 700;
			letter-spacing: -.3px;
			margin: 0 0 4px;
		}
		.brand-subtitle {
			color: rgba(255,255,255,.5);
			font-size: 13px;
			font-weight: 400;
			margin: 0;
		}

		/* Divider */
		.card-divider {
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
			margin: 0 0 28px;
		}

		/* ── Alerts ──────────────────────────────────────────────── */
		.alert {
			border-radius: 10px;
			font-size: 13.5px;
			padding: 10px 14px;
			border: none;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 8px;
			animation: slideDown .35s ease both;
		}
		@keyframes slideDown {
			from { opacity: 0; transform: translateY(-8px); }
			to   { opacity: 1; transform: translateY(0); }
		}
		.alert-success {
			background: rgba(34,197,94,.18);
			color: #86efac;
			border-left: 3px solid #22c55e;
		}
		.alert-danger {
			background: rgba(239,68,68,.18);
			color: #fca5a5;
			border-left: 3px solid #ef4444;
		}
		.alert-warning {
			background: rgba(234,179,8,.18);
			color: #fde047;
			border-left: 3px solid #eab308;
		}
		.alert-info {
			background: rgba(14,165,233,.18);
			color: #7dd3fc;
			border-left: 3px solid #0ea5e9;
		}
		.btn-close { filter: invert(1) brightness(1.5); }

		/* ── Input fields ────────────────────────────────────────── */
		.input-group-login {
			position: relative;
			margin-bottom: 16px;
		}
		.input-group-login .input-icon {
			position: absolute;
			left: 16px;
			top: 50%;
			transform: translateY(-50%);
			color: rgba(255,255,255,.4);
			font-size: 15px;
			pointer-events: none;
			transition: color .25s;
			z-index: 2;
		}
		.input-group-login:focus-within .input-icon { color: #38bdf8; }

		.input-group-login input {
			width: 100%;
			background: rgba(255,255,255,.08);
			border: 1px solid rgba(255,255,255,.12);
			border-radius: 12px;
			padding: 13px 16px 13px 44px;
			color: #fff;
			font-size: 14px;
			font-family: 'Inter', sans-serif;
			outline: none;
			transition: border-color .25s, background .25s, box-shadow .25s;
		}
		.input-group-login input::placeholder { color: rgba(255,255,255,.35); }
		.input-group-login input:focus {
			border-color: #38bdf8;
			background: rgba(255,255,255,.12);
			box-shadow: 0 0 0 3px rgba(56,189,248,.15);
		}

		/* Password toggle */
		.pw-toggle {
			position: absolute;
			right: 14px;
			top: 50%;
			transform: translateY(-50%);
			color: rgba(255,255,255,.35);
			cursor: none;
			font-size: 14px;
			background: none;
			border: none;
			padding: 4px;
			z-index: 2;
			transition: color .2s;
		}
		.pw-toggle:hover { color: #38bdf8; }

		/* ── Sign In button ──────────────────────────────────────── */
		.btn-signin {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 12px;
			font-size: 15px;
			font-weight: 600;
			font-family: 'Inter', sans-serif;
			color: #fff;
			background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
			cursor: none;
			position: relative;
			overflow: hidden;
			transition: transform .2s, box-shadow .2s;
			box-shadow: 0 4px 20px rgba(14,165,233,.35);
			margin-top: 6px;
		}
		.btn-signin::before {
			content: '';
			position: absolute;
			inset: 0;
			background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
			opacity: 0;
			transition: opacity .25s;
		}
		.btn-signin:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,.5); }
		.btn-signin:hover::before { opacity: 1; }
		.btn-signin:active { transform: translateY(0); }

		/* ripple on click */
		.ripple {
			position: absolute;
			border-radius: 50%;
			background: rgba(255,255,255,.3);
			transform: scale(0);
			animation: rippleAnim .55s linear;
			pointer-events: none;
		}
		@keyframes rippleAnim {
			to { transform: scale(4); opacity: 0; }
		}

		/* ── Footer text ─────────────────────────────────────────── */
		.card-footer-text {
			text-align: center;
			margin-top: 22px;
			color: rgba(255,255,255,.35);
			font-size: 12px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
		}
		.card-footer-text i { color: rgba(255,255,255,.25); }

		/* ── Floating label shimmer on card top edge ─────────────── */
		.card-glow {
			position: absolute;
			top: -1px; left: 20%; right: 20%;
			height: 2px;
			background: linear-gradient(90deg, transparent, #38bdf8, #2563eb, transparent);
			border-radius: 99px;
			animation: shimmerLine 3s ease-in-out infinite;
		}
		@keyframes shimmerLine {
			0%,100% { opacity: .4; left: 20%; right: 20%; }
			50%      { opacity: 1;  left: 10%; right: 10%; }
		}
	</style>
</head>

<body>
	<!-- Custom cursor -->
	<div class="cursor-dot" id="cursorDot"></div>
	<div class="cursor-ring" id="cursorRing"></div>

	<!-- Background -->
	<div class="bg-photo"></div>

	<!-- Floating particles -->
	<div class="particles" id="particles"></div>

	<!-- Page wrapper -->
	<div class="page-wrapper">
		<div class="login-card" style="position:relative;">
			<div class="card-glow"></div>

			<!-- Brand -->
			<div class="brand-area">
				<div class="brand-icon">
					<i class="fas fa-bolt"></i>
				</div>
				<h1 class="brand-title">Bolt Inspection</h1>
				<p class="brand-subtitle">Management Portal — Sign in to continue</p>
			</div>

			<div class="card-divider"></div>

			<!-- Alerts -->
			{% include "base/alert.html" %}

			<!-- Form -->
			<form method="post" autocomplete="off" id="loginForm">
				{% csrf_token %}
				<input type="hidden" name="next" value="{{ next }}">

				<div class="input-group-login">
					<span class="input-icon"><i class="fas fa-user"></i></span>
					<input type="text" name="username" placeholder="Username" autocomplete="username" required>
				</div>

				<div class="input-group-login">
					<span class="input-icon"><i class="fas fa-lock"></i></span>
					<input type="password" name="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
					<button type="button" class="pw-toggle" id="pwToggle" tabindex="-1">
						<i class="fas fa-eye" id="pwIcon"></i>
					</button>
				</div>

				<button type="submit" class="btn-signin" id="signinBtn">
					<i class="fas fa-sign-in-alt me-2"></i> Sign In
				</button>
			</form>

			<div class="card-footer-text">
				<i class="fas fa-shield-alt"></i>
				Secure · Encrypted · Bolt Company &copy; 2025
			</div>
		</div>
	</div>

	<script src="{% static 'js/vendor.min.js' %}"></script>
	<script src="{% static 'js/app.min.js' %}"></script>
	<script>
	(function () {
		/* ── Custom cursor ─────────────────────────────── */
		const dot  = document.getElementById('cursorDot');
		const ring = document.getElementById('cursorRing');
		let mx = -100, my = -100, rx = -100, ry = -100;

		document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

		(function animCursor() {
			rx += (mx - rx) * .14;
			ry += (my - ry) * .14;
			dot.style.left  = mx + 'px';
			dot.style.top   = my + 'px';
			ring.style.left = rx + 'px';
			ring.style.top  = ry + 'px';
			requestAnimationFrame(animCursor);
		})();

		document.querySelectorAll('input, button, a, .pw-toggle').forEach(el => {
			el.addEventListener('mouseenter', () => ring.classList.add('shrink'));
			el.addEventListener('mouseleave', () => ring.classList.remove('shrink'));
		});

		/* ── Floating particles ────────────────────────── */
		const container = document.getElementById('particles');
		const COLORS = ['#38bdf8','#818cf8','#34d399','#f472b6','#fbbf24'];
		for (let i = 0; i < 22; i++) {
			const p = document.createElement('div');
			p.className = 'particle';
			const size = Math.random() * 5 + 3;
			p.style.cssText = [
				`width:${size}px`,
				`height:${size}px`,
				`left:${Math.random()*100}%`,
				`bottom:${Math.random()*-20}%`,
				`background:${COLORS[Math.floor(Math.random()*COLORS.length)]}`,
				`animation-duration:${Math.random()*14+8}s`,
				`animation-delay:${Math.random()*10}s`,
			].join(';');
			container.appendChild(p);
		}

		/* ── Password toggle ───────────────────────────── */
		const pwInput = document.getElementById('passwordInput');
		const pwIcon  = document.getElementById('pwIcon');
		document.getElementById('pwToggle').addEventListener('click', () => {
			const show = pwInput.type === 'password';
			pwInput.type = show ? 'text' : 'password';
			pwIcon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
		});

		/* ── Ripple on Sign In ─────────────────────────── */
		document.getElementById('signinBtn').addEventListener('click', function (e) {
			const r = document.createElement('span');
			r.className = 'ripple';
			const rect = this.getBoundingClientRect();
			const size = Math.max(rect.width, rect.height);
			r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
			this.appendChild(r);
			setTimeout(() => r.remove(), 600);
		});

		/* ── Loading state on submit ───────────────────── */
		document.getElementById('loginForm').addEventListener('submit', function () {
			const btn = document.getElementById('signinBtn');
			btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing in…';
			btn.disabled = true;
		});
	})();
	</script>
</body>
</html>
