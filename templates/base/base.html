<head>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

	<!-- ================== BEGIN core-css ================== -->
	<link rel="stylesheet" href="{% static 'css/custom.css' %}" type="text/css" />
	<!-- ================== END core-css ================== -->
	<style>
		.mt-19-custom { margin-top: 19rem; }
        .mt-11-custom { margin-top: 11rem; }
		.mt-5-5-custom { margin-top: 5.5rem; }

		/* ── Global font ──────────────────────────────────────── */
		body, .modal, .dropdown-menu, .table, input, select, textarea, button {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
		}

		/* ── Scrollbars ───────────────────────────────────────── */
		::-webkit-scrollbar { width: 5px; height: 5px; }
		::-webkit-scrollbar-track { background: #f1f5f9; }
		::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 99px; }
		::-webkit-scrollbar-thumb:hover { background: #64748b; }
		.pagination-wrapper::-webkit-scrollbar { height: 5px; }
		.pagination-wrapper::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 99px; }

		/* ── Content area ─────────────────────────────────────── */
		#content.app-content { background: #f1f5f9; }

		/* ── Page header ──────────────────────────────────────── */
		.page-header {
			font-size: 1.35rem;
			font-weight: 700;
			color: #0f172a;
			letter-spacing: -.3px;
			padding-bottom: 14px;
			margin-bottom: 22px;
			border-bottom: 2px solid #e2e8f0;
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 8px;
		}

		/* ── Cards ────────────────────────────────────────────── */
		.card {
			border-radius: 14px !important;
			border: 1px solid #e2e8f0 !important;
			box-shadow: 0 1px 4px rgba(0,0,0,.06) !important;
			transition: box-shadow .2s ease, transform .2s ease;
		}
		.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1) !important; }
		.card-header {
			border-radius: 14px 14px 0 0 !important;
			font-weight: 600;
			font-size: 14px;
			letter-spacing: .1px;
		}
		.card-body { padding: 18px 20px; }

		/* ── Small stat boxes ─────────────────────────────────── */
		.small-box {
			border-radius: 14px !important;
			overflow: hidden;
			transition: transform .2s ease, box-shadow .2s ease;
		}
		.small-box:hover {
			transform: translateY(-4px);
			box-shadow: 0 10px 30px rgba(0,0,0,.18) !important;
		}

		/* ── Tables ───────────────────────────────────────────── */
		.table { font-size: 13.5px; }
		.table thead th {
			font-weight: 600;
			font-size: 11.5px;
			text-transform: uppercase;
			letter-spacing: .6px;
			color: #475569;
			background: #f8fafc;
			border-bottom: 2px solid #e2e8f0 !important;
			padding: 10px 12px;
			white-space: nowrap;
		}
		.table tbody td { padding: 10px 12px; vertical-align: middle; }
		.table-hover tbody tr {
			transition: background .15s ease;
		}
		.table-hover tbody tr:hover { background: #f0f9ff !important; }

		/* ── Buttons ──────────────────────────────────────────── */
		.btn {
			border-radius: 8px !important;
			font-size: 13px;
			font-weight: 500;
			letter-spacing: .1px;
			transition: transform .15s ease, box-shadow .15s ease !important;
		}
		.btn-sm { border-radius: 6px !important; font-size: 12px; }
		.btn-lg { border-radius: 10px !important; font-size: 15px; }
		.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
		.btn:active { transform: translateY(0) !important; }

		/* ── Badges ───────────────────────────────────────────── */
		.badge {
			border-radius: 6px !important;
			font-weight: 500 !important;
			font-size: 11.5px !important;
			padding: 4px 8px !important;
			letter-spacing: .2px;
		}

		/* ── Alerts ───────────────────────────────────────────── */
		.alert {
			border-radius: 10px !important;
			border: none !important;
			border-left: 4px solid !important;
			font-size: 13.5px;
			font-weight: 500;
			padding: 12px 16px;
			display: flex;
			align-items: center;
			gap: 10px;
			animation: alertSlide .35s ease both;
		}
		@keyframes alertSlide {
			from { opacity: 0; transform: translateY(-8px); }
			to   { opacity: 1; transform: translateY(0); }
		}
		.alert-success { background: #f0fdf4; color: #166534; border-color: #22c55e !important; }
		.alert-danger  { background: #fef2f2; color: #991b1b; border-color: #ef4444 !important; }
		.alert-warning { background: #fffbeb; color: #92400e; border-color: #f59e0b !important; }
		.alert-info    { background: #eff6ff; color: #1e40af; border-color: #3b82f6 !important; }

		/* ── Modals ───────────────────────────────────────────── */
		.modal-content {
			border-radius: 16px !important;
			border: none !important;
			box-shadow: 0 20px 60px rgba(0,0,0,.2) !important;
			overflow: hidden;
		}
		.modal-header { padding: 18px 24px; border-bottom: 1px solid #f1f5f9; }
		.modal-body { padding: 20px 24px; }
		.modal-footer { padding: 14px 24px; border-top: 1px solid #f1f5f9; }
		.modal-title { font-weight: 600; font-size: 16px; }

		/* ── Form controls ────────────────────────────────────── */
		.form-control, .form-select {
			border-radius: 8px !important;
			border: 1px solid #e2e8f0 !important;
			font-size: 13.5px !important;
			padding: 8px 12px !important;
			transition: border-color .2s, box-shadow .2s !important;
		}
		.form-control:focus, .form-select:focus {
			border-color: #3b82f6 !important;
			box-shadow: 0 0 0 3px rgba(59,130,246,.12) !important;
		}
		.form-label { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 5px; }

		/* ── Pagination ───────────────────────────────────────── */
		.pagination .page-link {
			border-radius: 8px !important;
			margin: 0 2px;
			font-size: 13px;
			font-weight: 500;
			color: #475569;
			border: 1px solid #e2e8f0;
			padding: 6px 12px;
			transition: all .2s;
		}
		.pagination .page-item.active .page-link {
			background: #3b82f6;
			border-color: #3b82f6;
			color: #fff;
			box-shadow: 0 2px 8px rgba(59,130,246,.35);
		}
		.pagination .page-link:hover { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
		.pagination .page-item.disabled .page-link { opacity: .5; }
    </style>

	<!-- ================== END page-css ================== -->
</head>

	<!-- ================== Start #Only ASCII character in that range allowed" ================== -->
	<script>
		function onlyNumberKey(evt) {
			// Only ASCII character in that range allowed
			var ASCIICode = (evt.which) ? evt.which : evt.keyCode
			if (ASCIICode > 31 && (ASCIICode < 48 || ASCIICode > 57))
				return false;
			return true;
		}
	</script>
	<!-- ================== End #Only ASCII character in that range allowed" ================== -->
	

	<script>
		function showPassword(userId) {
			$.ajax({
				url: '/reset_password/' + userId,
				type: 'GET',
				success: function(response) {
					$('#decryptedPassword').text(response.user_password_reset);
				},
				error: function(error) {
					alert('Error fetching password');
				}
			});
		}
	</script>
	

	<!-- For Profile Image change -->
	<script>
		function displayImg(input, imgElement) {
			var file = input.files[0];
			var reader = new FileReader();

			reader.onload = function(e) {
				imgElement.attr('src', e.target.result);
			}

			reader.readAsDataURL(file);
		}
	</script>
