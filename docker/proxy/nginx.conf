worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 512; }

# One public port, two protocols: look at the first bytes of each connection
# and hand it to the plain or the TLS server below.
stream {
    map $ssl_preread_protocol $bolt_backend {
        ""      127.0.0.1:8081;
        default 127.0.0.1:8443;
    }
    server {
        listen 8010;
        ssl_preread on;
        proxy_protocol on;  # keeps the visitor's real IP across this hop
        proxy_pass $bolt_backend;
    }
}

http {
    access_log off;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # The host's nginx (app.boltlimited.com) arrives from the Docker gateway and
    # sets the visitor's IP itself. Nobody else may supply that header.
    map $remote_addr $bolt_client_ip {
        ~^172\.  $http_x_forwarded_for;
        default  $remote_addr;
    }

    server {
        listen 127.0.0.1:8081 proxy_protocol;
        listen 127.0.0.1:8443 ssl proxy_protocol;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            # Through a variable so nginx starts even if the web app isn't up yet.
            set $bolt_web http://bolt-web:8000;
            proxy_pass $bolt_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $bolt_client_ip;
        }
    }
}
