# Docker copy of Bolt + WhatsApp verification bot, deployed through Hostinger
# Docker Manager. Secrets come from the project's environment (set in Docker
# Manager), never this file.
#
# The original app's folder is mounted READ-ONLY (:ro) and only read to import
# a copy of its data. The original app keeps running untouched.
#
# The server has 1 CPU / 4 GB RAM shared with the live app, so every service
# here has hard memory/CPU limits and can never starve the live app.
services:
  web:
    # Built by .github/workflows/docker-image.yml (Docker Manager can't build).
    image: ghcr.io/programmer786/django_boltapp:latest
    container_name: bolt_docker_web
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      DB_ENGINE: mysql
      DB_NAME: bolt_docker
      DB_USER: bolt_docker
      DB_PASSWORD: ${BOLT_DB_PASSWORD}
      DB_HOST: shared_mysql
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      SERVE_MEDIA: "1"
      LIVE_APP_DIR: /live
      GUNICORN_WORKERS: "2"
      WA_BOT_KEY: ${WA_BOT_KEY}
      OLLAMA_URL: http://bolt_ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      EXTRA_ALLOWED_HOSTS: bolt-web
    volumes:
      - bolt_media:/app/media
      - /var/www/django_project:/live:ro
    mem_limit: 1000m
    networks:
      shared_network:
        # Hostnames with "_" are rejected by Django; the listener uses this alias.
        aliases:
          - bolt-web

  wa_listener:
    image: ghcr.io/programmer786/django_boltapp:listener
    container_name: bolt_wa_listener
    restart: unless-stopped
    depends_on:
      - web
    environment:
      BOLT_API_URL: http://bolt-web:8000/wa-bot/api
      WA_BOT_KEY: ${WA_BOT_KEY}
    volumes:
      # v2: fresh session (the first one was left half-written by an out-of-memory kill)
      - bolt_wa_session_v2:/data/session
    shm_size: 512m
    # WhatsApp Web's first sync after a QR scan is heavy; 600m/0.5 CPU stalled it.
    mem_limit: 1200m
    cpus: 1.0
    networks:
      - shared_network

  sync:
    # Keeps the copy in step with the live db.sqlite3 (docker/sync_live.py):
    # checks every 30s, syncs only changed rows, at most once per 2 minutes.
    image: ghcr.io/programmer786/django_boltapp:latest
    container_name: bolt_live_sync
    restart: unless-stopped
    depends_on:
      - web
    entrypoint: ["python", "docker/sync_live.py"]
    environment:
      DB_ENGINE: mysql
      DB_NAME: bolt_docker
      DB_USER: bolt_docker
      DB_PASSWORD: ${BOLT_DB_PASSWORD}
      DB_HOST: shared_mysql
      DB_PORT: "3306"
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      LIVE_APP_DIR: /live
      SYNC_POLL_SECONDS: "30"
      SYNC_MIN_INTERVAL: "120"
    volumes:
      - bolt_media:/app/media
      - /var/www/django_project:/live:ro
    mem_limit: 700m
    cpus: 0.4
    networks:
      - shared_network

  ollama:
    image: ollama/ollama:latest
    container_name: bolt_ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Start the server, download the small free model once (kept in the volume).
    command: ["ollama serve & sleep 5 && ollama pull qwen2.5:0.5b; wait"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Unload the model when idle so its RAM is free for the listener.
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - bolt_ollama_models:/root/.ollama
    mem_limit: 900m
    cpus: 0.6
    networks:
      - shared_network

volumes:
  bolt_media:
  bolt_wa_session_v2:
  bolt_ollama_models:

networks:
  shared_network:
    external: true
